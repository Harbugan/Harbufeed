name: Deploy Harbufeed

on:
  push:
    branches: [main, feature/v0.2.0-google-youtube]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbufeed-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload website
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET="Harbufeed"
          else
            TARGET="Harbufeed-test"
          fi
          for file in index.html app.js styles.css youtube.js; do
            curl --fail --show-error --silent --retry 2 --ssl-reqd --ftp-pasv --user "$FTP_USER:$FTP_PASSWORD" --upload-file "$file" "ftp://cp17.nordicway.dk//public_html/Projects/$TARGET/$file"
          done
          for file in api/bootstrap.php api/.htaccess api/auth/login.php api/auth/callback.php api/auth/status.php api/auth/logout.php api/youtube/profile.php api/youtube/subscriptions.php api/youtube/videos.php; do
            curl --fail --show-error --silent --retry 2 --ssl-reqd --ftp-pasv --ftp-create-dirs --user "$FTP_USER:$FTP_PASSWORD" --upload-file "$file" "ftp://cp17.nordicway.dk//public_html/Projects/$TARGET/$file"
          done
